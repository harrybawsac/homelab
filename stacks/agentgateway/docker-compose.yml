services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.3.1
    container_name: agentgateway
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${LAN_IP:-0.0.0.0}:3000:3000"
      - "${LAN_IP:-0.0.0.0}:4000:4000"
      - "127.0.0.1:15000:15000"
    volumes:
      - ./config:/config
    networks:
      - proxy

networks:
  proxy:
    external: true
